name: Build and Deploy Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - 'main.tex'
      - 'resume.cls'
      - 'mypic.png'
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build_and_commit:
    runs-on: ubuntu-24.04 # Resolves the ubuntu-latest migration notice
    steps:
      - name: Checkout Repository
        # actions/checkout @ latest commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a 

      - name: Compile LaTeX to PDF
        # xu-cheng/latex-action @ latest commit
        uses: xu-cheng/latex-action@edc9ed6a54876207fe7bae248873d99560dd9ead 
        with:
          root_file: main.tex
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Rename Output to Target Verbatim Name
        run: mv main.pdf Krishna_Priyatham_Potluri_s_Resume.pdf

      - name: Commit and Push Generated PDF
        # stefanzweifel/git-auto-commit-action @ latest commit
        uses: stefanzweifel/git-auto-commit-action@92648143fd6aebb695590bfe3fc28f92bcf383e4 
        with:
          commit_message: "chore: Auto-compile Krishna_Priyatham_Potluri_s_Resume.pdf from main.tex"
          file_pattern: "Krishna_Priyatham_Potluri_s_Resume.pdf"
